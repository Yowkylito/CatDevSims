[package]
name = "steward-core"
version = "0.1.0"
edition = "2021"
description = "Steward routing core: local classify, send gate, mock backends, SQLite history"
license = "MIT"
publish = false

[dependencies]
hex = "0.4"
keyring = "3"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[lib]
name = "steward_core"
path = "src/lib.rs"
