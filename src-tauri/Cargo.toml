[package]
name = "steward"
version = "0.1.0"
description = "Steward — local prompt router (Tauri 2)"
authors = ["Steward"]
edition = "2021"
publish = false

[lib]
name = "steward_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
steward-core = { path = "../steward-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
